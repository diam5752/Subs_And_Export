misconfigurations:
  - id: DS-0002
    paths:
      - deploy/caddy-security/Dockerfile
    statement: >-
      Reviewed existing stock Caddy proxy UID0 role preserves root-owned TLS
      key/data/config volume permissions and listener bindings. No user,
      capability, privilege or mount is added. See deploy/caddy-security/README.md.
      This exception covers only this recipe file's final proxy-image role;
      application Dockerfiles and all dependency CVE rules remain enforced.
  - id: DS-0002
    paths:
      - deploy/postgres-security/Dockerfile
    statement: >-
      Reviewed existing PostgreSQL image role starts the official entrypoint as
      root for its existing data-directory setup, then gosu changes to postgres
      UID 70 on Alpine or UID 999 on Debian 12. This preserves the existing volume
      ownership and entrypoint contract; no user, capability or mount is added.
      See deploy/postgres-security/README.md. Scope is this database recipe file only;
      application Dockerfiles and dependency CVEs remain enforced.
