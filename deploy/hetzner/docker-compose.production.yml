name: subframe

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    env_file:
      - ${SUBFRAME_ENV_FILE:?SUBFRAME_ENV_FILE is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - private
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: subframe-backend:${SUBFRAME_RELEASE_SHA:?SUBFRAME_RELEASE_SHA is required}
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        REQUIREMENTS_FILE: backend/requirements.mock.txt
    env_file:
      - ${SUBFRAME_ENV_FILE:?SUBFRAME_ENV_FILE is required}
    environment:
      GSP_APP_ENV: production
      APP_ENV: production
      PORT: "8080"
      GSP_MOCK_EXTERNAL_SERVICES: "0"
      GSP_ELEVENLABS_ENABLED: "1"
      GSP_ELEVENLABS_API_BASE: "http://edge:8081/elevenlabs"
      GSP_USE_FILE_SECRETS: "0"
      GSP_PAID_CREDITS_ENABLED: "1"
      GSP_CONSUMER_POLICY_APPROVED: "1"
      GSP_DURABLE_CONFIRMATION_CHANNEL_READY: "1"
      GSP_ADJUSTMENT_WORKFLOW_READY: "1"
      GSP_STRIPE_AUTOMATIC_TAX_ENABLED: "0"
      GSP_STRIPE_API_BASE: "http://edge:8081/stripe"
      GSP_STRIPE_RESTRICTED_KEY: "${GSP_STRIPE_RESTRICTED_KEY:-}"
      GSP_STRIPE_WEBHOOK_SECRET: "${GSP_STRIPE_WEBHOOK_SECRET:-}"
      GSP_STRIPE_PRICE_STARTER: "${GSP_STRIPE_PRICE_STARTER:-}"
      GSP_STRIPE_PRICE_CORE: "${GSP_STRIPE_PRICE_CORE:-}"
      GSP_STRIPE_PRICE_PRO: "${GSP_STRIPE_PRICE_PRO:-}"
      GSP_BILLING_ADMIN_USER_IDS: ""
      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
      OPENAI_API_KEY: ""
      GROQ_API_KEY: ""
      ELEVENLABS_API_KEY: "${ELEVENLABS_API_KEY:?ELEVENLABS_API_KEY is required}"
      GOOGLE_CLIENT_SECRET: ""
      GOOGLE_REDIRECT_URI: ""
      GSP_GOOGLE_OAUTH_CERTS_URL: "http://edge:8081/oauth2/v1/certs"
      GSP_EXTERNAL_PROVIDER_MONTHLY_BUDGET_USD: "100"
      GSP_EXTERNAL_PROVIDER_DAILY_BUDGET_USD: "10"
      GSP_EXTERNAL_PROVIDER_PER_REQUEST_BUDGET_USD: "0.05"
      GSP_EXTERNAL_PROVIDER_PRICE_SAFETY_MULTIPLIER: "1.25"
      GSP_MAX_ACTIVE_MEDIA_JOBS: "5"
      GSP_MEDIA_RENDER_SLOTS: "2"
      GSP_MEDIA_RENDER_THREADS_PER_SLOT: "2"
      GSP_MEDIA_EXTRACTION_SLOTS: "1"
      GSP_MEDIA_EXTRACTION_THREADS_PER_SLOT: "1"
      GSP_PROVIDER_TRANSCRIPTION_SLOTS: "8"
      GSP_WORKSPACE_RETENTION_HOURS: "24"
      GSP_STALE_JOB_RETENTION_HOURS: "6"
      GSP_ORPHAN_RETENTION_HOURS: "1"
      GSP_CLEANUP_INTERVAL_MINUTES: "15"
      GSP_STORAGE_MIN_FREE_MB: "2048"
      GSP_RETENTION_CLEANUP_ENABLED: "1"
      GSP_ERASURE_JOURNAL_DIR: "/privacy-erasure-journal"
      GSP_ERASURE_JOURNAL_RETENTION_DAYS: "30"
      GSP_ERASURE_JOURNAL_CONTINUITY_ID: "${SUBFRAME_PRIVACY_CONTINUITY_ID:-}"
      GSP_ERASURE_JOURNAL_ANCHOR_PATH: "/privacy-erasure-anchor/checkpoint.json"
    volumes:
      - app_data:/data
      - erasure_journal:/privacy-erasure-journal
      - ${SUBFRAME_ERASURE_ANCHOR_DIR:-../../.runtime/privacy-erasure-anchor}:/privacy-erasure-anchor
    networks:
      - private
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    cpus: "${SUBFRAME_BACKEND_CPUS:-3.0}"
    mem_limit: "${SUBFRAME_BACKEND_MEMORY_LIMIT:-3g}"
    pids_limit: 256
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 45s

  frontend:
    image: subframe-frontend:${SUBFRAME_RELEASE_SHA:?SUBFRAME_RELEASE_SHA is required}
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_MAX_UPLOAD_MB: ${SUBFRAME_MAX_UPLOAD_MB:-500}
        NEXT_PUBLIC_MAX_VIDEO_DURATION_SECONDS: ${SUBFRAME_MAX_VIDEO_DURATION_SECONDS:-600}
        NEXT_PUBLIC_TRANSCRIBE_PROVIDER: elevenlabs
        NEXT_PUBLIC_TRANSCRIBE_MODE: pro
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      APP_ENV: production
    networks:
      - private
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 30s

  edge:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    ports:
      - "127.0.0.1:${SUBFRAME_PREVIEW_PORT:-18090}:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      private: {}
      mizai_edge:
        aliases:
          - subframe-edge
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 15s

  privacy-relay:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    profiles:
      - privacy-maintenance
    volumes:
      - ./ElevenLabsErasureCaddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - private
      - provider_egress
    restart: "no"
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/health"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 2s

networks:
  private:
    name: subframe-private
    internal: true
  mizai_edge:
    external: true
    name: mizai_mizai-private
  provider_egress:
    name: subframe-provider-egress

volumes:
  postgres_data:
    name: subframe-postgres-data
  app_data:
    name: subframe-app-data
  erasure_journal:
    name: subframe-erasure-journal
