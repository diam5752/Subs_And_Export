name: nightly-quality

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nightly-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -e .[dev]

      - name: Run performance smoke gate
        run: python3 .codex/scripts/quality_runner.py check:performance

      - name: Run Java PIT mutation gate
        run: python3 .codex/scripts/quality_runner.py check:mutation
