version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:15'
      timezone: Europe/Athens
    open-pull-requests-limit: 5
    groups:
      routine-actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: '04:25'
      timezone: Europe/Athens
    open-pull-requests-limit: 5
    groups:
      routine-frontend:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directories:
      - /
      - /backend
    schedule:
      interval: weekly
      day: monday
      time: '04:35'
      timezone: Europe/Athens
    open-pull-requests-limit: 5
    groups:
      routine-python:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:45'
      timezone: Europe/Athens
    open-pull-requests-limit: 5
    groups:
      routine-java:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directories:
      - /
      - /frontend
    schedule:
      interval: weekly
      day: monday
      time: '04:55'
      timezone: Europe/Athens
    open-pull-requests-limit: 5
    groups:
      routine-images:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
