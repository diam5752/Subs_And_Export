name: GSubs
options:
  bundleIdPrefix: gr.gsubs
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
targets:
  GSubs:
    type: application
    platform: iOS
    sources:
      - path: GSubs
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: gr.gsubs.ios
        PRODUCT_NAME: GSubs
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: GSubs/Info.plist
      properties:
        CFBundleDisplayName: GSubs
        GSubsAPIBaseURL: https://gsubs.gr
        NSPhotoLibraryUsageDescription: Το GSubs ανοίγει το βίντεο μόνο στη συσκευή για τοπική επεξεργασία.
        NSPhotoLibraryAddUsageDescription: Το GSubs αποθηκεύει το τελικό βίντεο που εξάγεται τοπικά.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
  GSubsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GSubsTests
    dependencies:
      - target: GSubs
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: gr.gsubs.ios.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  GSubs:
    build:
      targets:
        GSubs: all
        GSubsTests: [test]
    test:
      targets:
        - GSubsTests
